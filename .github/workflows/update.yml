name: Refresh NFL snap dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install nflreadpy pandas requests pyarrow

      - name: Refresh MFL rosters and NFL snap data
        run: python scripts/update.py

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "nfl-snap-dashboard"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh NFL snap data"
          git push
